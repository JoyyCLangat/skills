name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version-bump check compares against the base branch
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: Unit tests (guard hook)
        run: python -m unittest discover -s tests -v

      - name: Validate skills, manifests, hooks, and secrets
        run: python scripts/validate.py

      - name: Plugin version bumped when the plugin changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_version_bump.py "origin/$BASE_REF"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Claude Code plugin validation (strict)
        run: |
          npm install --global --ignore-scripts @anthropic-ai/claude-code@2.1.299
          claude plugin validate --strict .
          claude plugin validate --strict plugins/impax-crm
